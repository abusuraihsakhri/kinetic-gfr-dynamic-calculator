name: Tests and security checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Compile Python
        run: python -m compileall -q kinetic_gfr.py cli.py agents tests
      - name: Run Python tests
        run: python -m pytest -q
      - name: Browser calculation regression tests
        run: node --test tests/test_web.cjs
      - name: Dependency vulnerability audit
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install pip-audit
          python -m pip_audit --strict
